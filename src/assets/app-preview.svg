<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Previsualización de Quick Arrival en un móvil">
  <defs>
    <clipPath id="screenClip">
      <rect x="62" y="48" width="276" height="412" rx="22"/>
    </clipPath>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.13"/>
    </filter>
    <filter id="phoneShadow" x="-15%" y="-8%" width="130%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- Phone shadow -->
  <rect x="54" y="12" width="292" height="476" rx="40" fill="#000" filter="url(#phoneShadow)" opacity="0.2"/>
  <!-- Phone frame -->
  <rect x="54" y="12" width="292" height="476" rx="40" fill="#1d1d1f"/>
  <!-- Side buttons -->
  <rect x="50" y="126" width="6" height="34" rx="3" fill="#2a2a2c"/>
  <rect x="50" y="170" width="6" height="54" rx="3" fill="#2a2a2c"/>
  <rect x="344" y="146" width="6" height="54" rx="3" fill="#2a2a2c"/>

  <!-- ── SCREEN CONTENT (clipped) ── -->
  <g clip-path="url(#screenClip)">

    <!-- MAP: CartoDB light_nolabels style -->
    <rect x="62" y="48" width="276" height="412" fill="#f2f2f2"/>

    <!-- Building blocks -->
    <rect x="62"  y="48"  width="48"  height="44" fill="#e8e8e8"/>
    <rect x="118" y="48"  width="36"  height="44" fill="#e8e8e8"/>
    <rect x="168" y="48"  width="52"  height="44" fill="#e8e8e8"/>
    <rect x="234" y="48"  width="42"  height="44" fill="#e8e8e8"/>
    <rect x="288" y="48"  width="50"  height="44" fill="#e8e8e8"/>

    <rect x="62"  y="104" width="48"  height="38" fill="#e8e8e8"/>
    <rect x="118" y="104" width="36"  height="38" fill="#e8e8e8"/>
    <rect x="168" y="104" width="52"  height="38" fill="#e8e8e8"/>
    <rect x="288" y="104" width="50"  height="38" fill="#e8e8e8"/>

    <rect x="62"  y="156" width="48"  height="42" fill="#e8e8e8"/>
    <rect x="168" y="156" width="52"  height="42" fill="#e8e8e8"/>
    <rect x="234" y="156" width="42"  height="42" fill="#e8e8e8"/>
    <rect x="288" y="156" width="50"  height="42" fill="#e8e8e8"/>

    <rect x="62"  y="210" width="48"  height="40" fill="#e8e8e8"/>
    <rect x="118" y="210" width="36"  height="40" fill="#e8e8e8"/>
    <rect x="288" y="210" width="50"  height="40" fill="#e8e8e8"/>

    <!-- Park / green area -->
    <rect x="168" y="210" width="52"  height="40" rx="4" fill="#d8ecd4"/>
    <rect x="234" y="210" width="42"  height="40" rx="4" fill="#d8ecd4"/>

    <!-- Roads (white, CartoDB style) -->
    <!-- Horizontal -->
    <rect x="62"  y="92"  width="276" height="12" fill="#ffffff"/>
    <rect x="62"  y="144" width="276" height="12" fill="#ffffff"/>
    <rect x="62"  y="198" width="276" height="14" fill="#ffffff"/>
    <!-- Vertical -->
    <rect x="110" y="48"  width="8"   height="210" fill="#ffffff"/>
    <rect x="154" y="48"  width="8"   height="210" fill="#ffffff"/>
    <rect x="220" y="48"  width="14"  height="210" fill="#ffffff"/>
    <rect x="280" y="48"  width="8"   height="210" fill="#ffffff"/>

    <!-- Diagonal road (avenida) -->
    <line x1="62" y1="160" x2="200" y2="48"  stroke="#ffffff" stroke-width="10"/>
    <line x1="62" y1="160" x2="200" y2="48"  stroke="#f2f2f2" stroke-width="2" opacity="0.5"/>

    <!-- ── BUS STOP MARKERS ── -->
    <!-- Stop 1: activa (seleccionada) - círculo más grande -->
    <circle cx="227" cy="155" r="10" fill="#fb2049" filter="url(#shadow)"/>
    <circle cx="227" cy="155" r="4"  fill="white"/>
    <!-- Halo de selección -->
    <circle cx="227" cy="155" r="14" fill="none" stroke="#fb2049" stroke-width="2.5" opacity="0.35"/>

    <!-- Stop 2 -->
    <circle cx="158" cy="98"  r="7" fill="#fb2049" opacity="0.75"/>
    <circle cx="158" cy="98"  r="3" fill="white"/>

    <!-- Stop 3 -->
    <circle cx="113" cy="150" r="7" fill="#fb2049" opacity="0.75"/>
    <circle cx="113" cy="150" r="3" fill="white"/>

    <!-- Stop 4 (interurbano - color diferente) -->
    <circle cx="285" cy="106" r="7" fill="#0071e3" opacity="0.8"/>
    <circle cx="285" cy="106" r="3" fill="white"/>

    <!-- ── USER LOCATION ── -->
    <!-- Pulse rings -->
    <circle cx="185" cy="185" r="22" fill="#fb2049" opacity="0.1"/>
    <circle cx="185" cy="185" r="14" fill="#fb2049" opacity="0.18"/>
    <!-- Avatar circle -->
    <circle cx="185" cy="185" r="9"  fill="#fb2049" filter="url(#shadow)"/>
    <circle cx="185" cy="185" r="6"  fill="#ff5a72"/>
    <!-- Person silhouette (simple) -->
    <circle cx="185" cy="182" r="2.5" fill="white"/>
    <path d="M181 189 Q185 186 189 189" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- ── HAMBURGER BUTTON (sidebar toggle) ── -->
    <rect x="72" y="60" width="36" height="36" rx="10" fill="white" filter="url(#shadow)"/>
    <rect x="80" y="70" width="20" height="2.5" rx="1.25" fill="#1d1d1f"/>
    <rect x="80" y="77" width="20" height="2.5" rx="1.25" fill="#1d1d1f"/>
    <rect x="80" y="84" width="20" height="2.5" rx="1.25" fill="#1d1d1f"/>

    <!-- ── BOTTOM SHEET (peek state ~200px visible) ── -->
    <rect x="62" y="262" width="276" height="200" rx="0" fill="white"/>
    <!-- Rounded top -->
    <rect x="62" y="262" width="276" height="24"  fill="white"/>
    <rect x="62" y="262" width="276" height="4"   rx="0" fill="white"/>
    <!-- Top corners rounded -->
    <path d="M62,284 L62,268 Q62,262 68,262 L332,262 Q338,262 338,268 L338,284 Z" fill="white"/>

    <!-- Handle -->
    <rect x="180" y="271" width="40" height="5" rx="2.5" fill="#d1d1d6"/>

    <!-- Stop header -->
    <!-- Stop name -->
    <text x="78" y="296" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#1d1d1f">Arturo Soria - Nudo Manoteras</text>
    <!-- Type badge -->
    <rect x="78" y="302" width="44" height="16" rx="5" fill="#fff0f3"/>
    <text x="100" y="314" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="700" fill="#fb2049" text-anchor="middle" letter-spacing="0.3">URBANO</text>
    <!-- Close button -->
    <circle cx="325" cy="291" r="12" fill="#f0f0f0"/>
    <text x="325" y="295.5" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#555" text-anchor="middle">✕</text>

    <!-- Line badges -->
    <rect x="78"  y="322" width="26" height="18" rx="6" fill="#fff0f3" stroke="#fbc0cb" stroke-width="0.8"/>
    <text x="91"  y="335" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="#fb2049" text-anchor="middle">29</text>
    <rect x="110" y="322" width="26" height="18" rx="6" fill="#fff0f3" stroke="#fbc0cb" stroke-width="0.8"/>
    <text x="123" y="335" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="#fb2049" text-anchor="middle">52</text>
    <rect x="142" y="322" width="26" height="18" rx="6" fill="#fff0f3" stroke="#fbc0cb" stroke-width="0.8"/>
    <text x="155" y="335" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="#fb2049" text-anchor="middle">70</text>
    <rect x="174" y="322" width="30" height="18" rx="6" fill="#fff0f3" stroke="#fbc0cb" stroke-width="0.8"/>
    <text x="189" y="335" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="#fb2049" text-anchor="middle">104</text>

    <!-- Separator -->
    <rect x="78" y="346" width="250" height="1" fill="#f0f0f0"/>

    <!-- Arrival row 1 -->
    <rect x="78" y="356" width="28" height="20" rx="6" fill="#fb2049"/>
    <text x="92"  y="370" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="800" fill="white" text-anchor="middle">29</text>
    <text x="116" y="370" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#333">Moncloa</text>
    <!-- YA badge -->
    <rect x="292" y="356" width="26" height="20" rx="10" fill="#fff0f3"/>
    <text x="305"  y="370" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="#fb2049" text-anchor="middle">YA</text>

    <!-- Separator -->
    <rect x="78" y="382" width="250" height="1" fill="#f5f5f5"/>

    <!-- Arrival row 2 -->
    <rect x="78" y="392" width="28" height="20" rx="6" fill="#fb2049"/>
    <text x="92"  y="406" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="800" fill="white" text-anchor="middle">52</text>
    <text x="116" y="406" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#333">Atocha</text>
    <text x="320"  y="406" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#666" text-anchor="middle">3 min</text>

    <!-- Separator -->
    <rect x="78" y="418" width="250" height="1" fill="#f5f5f5"/>

    <!-- Arrival row 3 (parcialmente visible) -->
    <rect x="78" y="428" width="28" height="20" rx="6" fill="#fb2049"/>
    <text x="92"  y="442" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="800" fill="white" text-anchor="middle">70</text>
    <text x="116" y="442" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#333">Pitis</text>
    <text x="320"  y="442" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#666" text-anchor="middle">7 min</text>

    <!-- Dynamic island -->
    <rect x="155" y="54" width="90" height="20" rx="10" fill="#1d1d1f"/>

  </g>

  <!-- Home indicator -->
  <rect x="163" y="470" width="74" height="5" rx="2.5" fill="white" opacity="0.22"/>
</svg>
